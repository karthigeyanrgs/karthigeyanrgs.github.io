name: Check broken links

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system dependencies 🧰
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.4"
          bundler-cache: false

      - name: Configure Bundler 🔧
        run: |
          rm -f Gemfile.lock
          bundle config set --local frozen false
          bundle install --jobs 4

      - name: Install HTMLProofer 💾
        run: gem install html-proofer

      - name: Build site 🔧
        run: bundle exec jekyll build

      - name: Check for broken links 🔍
        run: |
          htmlproofer ./_site \
            --assume-extension \
            --allow-hash-href \
            --disable-external \
            --checks 'Links,Images,Scripts' \
            --ignore-status-codes "403,429" \
            --ignore-urls "/^\\/(assets|assets\\/img|assets\\/pdf|feed\\.xml|sitemap\\.xml|robots\\.txt|favicon\\.ico|CNAME)$/" \
            --ignore-urls "/^\\/(blog|news|projects|cv|contact|gallery|repositories|skills|frequently-asked-questions|teaching|publications)(?:\\/|$)/" \
            --log-level :debug
